<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#102030"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg3)"/>

  <!-- top badge -->
  <rect x="80" y="80" width="300" height="48" fill="#ffb000" rx="4"/>
  <text x="230" y="113" font-family="Segoe UI, Helvetica, Arial" font-weight="700" font-size="22" fill="#0b0f17" text-anchor="middle" letter-spacing="2">MDPI INFORMATION · 2026</text>

  <!-- title -->
  <text x="80" y="240" font-family="Segoe UI, Helvetica, Arial" font-weight="800" font-size="88" fill="#e8eef5">Which peptides</text>
  <text x="80" y="340" font-family="Segoe UI, Helvetica, Arial" font-weight="800" font-size="88" fill="#e8eef5">will your immune</text>
  <text x="80" y="440" font-family="Segoe UI, Helvetica, Arial" font-weight="800" font-size="88" fill="#ffb000">system see?</text>

