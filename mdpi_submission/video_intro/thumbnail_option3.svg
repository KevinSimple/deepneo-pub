  <line x1="80" y1="500" x2="200" y2="500" stroke="#4aa3df" stroke-width="4"/>
  <text x="80" y="560" font-family="Segoe UI, Helvetica, Arial" font-size="30" fill="#e8eef5">A compact protein language model for peptide–MHC ranking</text>
