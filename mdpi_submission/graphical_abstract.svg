<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="531" viewBox="0 0 1328 531" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <!-- background -->
  <rect width="1328" height="531" fill="#ffffff"/>

  <!-- orange left-strip accent -->
  <rect x="0" y="0" width="8" height="531" fill="#ffb000"/>

  <!-- title bar top -->
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0b4f8a">DeepNeo-CL</text>
  <text x="200" y="36" font-size="16" fill="#4a5560">·  a compact PLM for peptide–MHC ranking under a leakage-aware evaluation protocol</text>
  <line x1="30" y1="50" x2="1298" y2="50" stroke="#dbe2eb" stroke-width="1"/>

  <!-- =============== Panel A: BIOLOGY (left) =============== -->
  <g transform="translate(30, 72)">
    <text x="0" y="18" font-size="13" font-weight="700" fill="#c08000" letter-spacing="2">1 · THE TASK</text>
    <text x="0" y="46" font-size="20" font-weight="700" fill="#0b4f8a">Which peptides does MHC class I present?</text>

    <!-- cell -->
    <ellipse cx="195" cy="260" rx="175" ry="80" fill="#e8eef5" stroke="#4aa3df" stroke-width="2"/>
    <text x="195" y="340" fill="#4a5560" font-size="12" text-anchor="middle">cell interior</text>

    <!-- MHCs on surface -->
    <rect x="130" y="185" width="24" height="40" fill="#ffb000" rx="3"/>
    <circle cx="135" cy="178" r="5" fill="#2e8540"/>
    <circle cx="142" cy="175" r="5" fill="#2e8540"/>
    <circle cx="149" cy="178" r="5" fill="#2e8540"/>

    <rect x="186" y="183" width="24" height="42" fill="#ffb000" rx="3"/>
    <circle cx="190" cy="176" r="5" fill="#e3604e"/>
    <circle cx="197" cy="173" r="5" fill="#e3604e"/>
    <circle cx="204" cy="176" r="5" fill="#e3604e"/>

    <rect x="242" y="187" width="24" height="40" fill="#ffb000" rx="3"/>
    <circle cx="246" cy="180" r="5" fill="#2e8540"/>
    <circle cx="253" cy="177" r="5" fill="#2e8540"/>
    <circle cx="260" cy="180" r="5" fill="#2e8540"/>

    <!-- labels for MHC + peptide -->
    <text x="100" y="200" font-size="10" fill="#c08000" text-anchor="end">MHC-I</text>
    <text x="100" y="180" font-size="10" fill="#2e8540" text-anchor="end">normal</text>
    <text x="290" y="180" font-size="10" fill="#e3604e" text-anchor="start">abnormal</text>

    <!-- T-cell -->
    <circle cx="195" cy="100" r="32" fill="#4aa3df" opacity="0.9"/>
    <text x="195" y="105" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">T-cell</text>

    <!-- arrow down from T-cell to abnormal MHC -->
    <line x1="195" y1="135" x2="197" y2="170" stroke="#e3604e" stroke-width="2" stroke-dasharray="4,2"/>
    <polygon points="197,178 191,167 203,167" fill="#e3604e"/>

    <!-- rank candidates label -->
    <text x="0" y="400" font-size="13" fill="#4a5560">Rank 10² – 10⁴ peptides against one HLA allele,</text>
    <text x="0" y="418" font-size="13" fill="#4a5560">upstream of experimental validation.</text>
  </g>

  <!-- divider -->
  <line x1="430" y1="72" x2="430" y2="495" stroke="#dbe2eb" stroke-width="1"/>

  <!-- =============== Panel B: MODEL (middle) =============== -->
  <g transform="translate(450, 72)">
    <text x="0" y="18" font-size="13" font-weight="700" fill="#c08000" letter-spacing="2">2 · THE MODEL</text>
    <text x="0" y="46" font-size="20" font-weight="700" fill="#0b4f8a">DeepNeo-CL · 35 M-parameter trunk</text>

    <!-- flow boxes -->
    <!-- Input -->
    <rect x="0" y="80" width="140" height="54" fill="#e8eef5" stroke="#4aa3df" stroke-width="1.5" rx="6"/>
    <text x="70" y="104" font-size="12" font-weight="600" fill="#0b4f8a" text-anchor="middle">Peptide + HLA</text>
    <text x="70" y="122" font-size="11" fill="#4a5560" text-anchor="middle">(sequence pair)</text>

    <!-- arrow -->
    <line x1="140" y1="107" x2="175" y2="107" stroke="#8da1b8" stroke-width="2"/>
    <polygon points="175,107 168,103 168,111" fill="#8da1b8"/>

    <!-- ESM2 trunk -->
    <rect x="180" y="80" width="140" height="54" fill="#fff4d4" stroke="#ffb000" stroke-width="2" rx="6"/>
    <text x="250" y="100" font-size="13" font-weight="700" fill="#0b4f8a" text-anchor="middle">ESM2-35M</text>
    <text x="250" y="118" font-size="10" fill="#4a5560" text-anchor="middle">pretrained PLM trunk</text>

    <!-- arrow -->
    <line x1="250" y1="134" x2="250" y2="170" stroke="#8da1b8" stroke-width="2"/>
    <polygon points="250,170 246,163 254,163" fill="#8da1b8"/>

    <!-- Cross-attention -->
    <rect x="180" y="175" width="140" height="48" fill="#e8eef5" stroke="#4aa3df" stroke-width="1.5" rx="6"/>
    <text x="250" y="194" font-size="12" font-weight="600" fill="#0b4f8a" text-anchor="middle">peptide × HLA</text>
    <text x="250" y="212" font-size="11" fill="#4a5560" text-anchor="middle">cross-attention + V37</text>

    <!-- split arrows to two heads -->
    <line x1="200" y1="223" x2="150" y2="260" stroke="#8da1b8" stroke-width="2"/>
    <polygon points="150,260 157,253 159,261" fill="#8da1b8"/>
    <line x1="300" y1="223" x2="350" y2="260" stroke="#8da1b8" stroke-width="2"/>
    <polygon points="350,260 342,261 344,253" fill="#8da1b8"/>

    <!-- BA head -->
    <rect x="60" y="265" width="130" height="44" fill="#e8f5ea" stroke="#2e8540" stroke-width="1.5" rx="6"/>
    <text x="125" y="282" font-size="12" font-weight="700" fill="#1a6b2e" text-anchor="middle">BA head</text>
    <text x="125" y="300" font-size="10" fill="#4a5560" text-anchor="middle">censored log-IC50</text>

    <!-- EL head -->
    <rect x="310" y="265" width="130" height="44" fill="#e8f5ea" stroke="#2e8540" stroke-width="1.5" rx="6"/>
    <text x="375" y="282" font-size="12" font-weight="700" fill="#1a6b2e" text-anchor="middle">EL head</text>
    <text x="375" y="300" font-size="10" fill="#4a5560" text-anchor="middle">focal BCE</text>

    <!-- merge arrows to fusion -->
    <line x1="125" y1="309" x2="200" y2="345" stroke="#8da1b8" stroke-width="2"/>
    <polygon points="200,345 192,342 194,350" fill="#8da1b8"/>
    <line x1="375" y1="309" x2="300" y2="345" stroke="#8da1b8" stroke-width="2"/>
    <polygon points="300,345 306,350 308,342" fill="#8da1b8"/>

    <!-- Ensemble + fusion -->
    <rect x="130" y="350" width="240" height="48" fill="#fff4d4" stroke="#ffb000" stroke-width="2" rx="6"/>
    <text x="250" y="370" font-size="13" font-weight="700" fill="#0b4f8a" text-anchor="middle">5-fold ensemble</text>
    <text x="250" y="388" font-size="11" fill="#4a5560" text-anchor="middle">deployed BA = batch-rank average</text>

    <!-- bottom caption -->
    <text x="0" y="418" font-size="13" fill="#4a5560">Trained on official NetMHCpan-4.1 BA + EL folds.</text>
  </g>

  <!-- divider -->
  <line x1="880" y1="72" x2="880" y2="495" stroke="#dbe2eb" stroke-width="1"/>

  <!-- =============== Panel C: HONEST EVALUATION (right) =============== -->
  <g transform="translate(900, 72)">
    <text x="0" y="18" font-size="13" font-weight="700" fill="#c08000" letter-spacing="2">3 · HONEST EVALUATION</text>
    <text x="0" y="46" font-size="20" font-weight="700" fill="#0b4f8a">Three-condition rule reveals a tie</text>

    <!-- three gates -->
    <g transform="translate(0, 80)">
      <!-- Gate 1 -->
      <rect x="0" y="0" width="400" height="36" fill="#e8eef5" stroke="#4aa3df" stroke-width="1" rx="4"/>
      <text x="12" y="22" font-size="12" fill="#0b4f8a">① DeLong paired ROC &nbsp;<tspan fill="#4a5560">— p &lt; 0.05 same rows</tspan></text>

      <!-- Gate 2 -->
      <rect x="0" y="44" width="400" height="36" fill="#e8eef5" stroke="#4aa3df" stroke-width="1" rx="4"/>
      <text x="12" y="66" font-size="12" fill="#0b4f8a">② Per-allele Wilcoxon &nbsp;<tspan fill="#4a5560">— Holm-adjusted across family</tspan></text>

      <!-- Gate 3 -->
      <rect x="0" y="88" width="400" height="36" fill="#e8eef5" stroke="#4aa3df" stroke-width="1" rx="4"/>
      <text x="12" y="110" font-size="12" fill="#0b4f8a">③ Allele-clustered bootstrap CI &nbsp;<tspan fill="#4a5560">— excludes zero</tspan></text>
    </g>

    <!-- result box -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="400" height="110" fill="#e8f5ea" stroke="#2e8540" stroke-width="1.5" rx="6"/>
      <text x="200" y="26" font-size="13" font-weight="700" fill="#1a6b2e" text-anchor="middle" letter-spacing="1">RESULT ON DECONTAMINATED TRANSPHLA (n = 118,143)</text>

      <text x="200" y="66" font-size="30" font-weight="800" fill="#1a6b2e" text-anchor="middle">DeepNeo = NetMHCpan-4.1</text>
      <text x="200" y="88" font-size="14" fill="#4a5560" text-anchor="middle">fusion vs fusion: 0.9573 vs 0.9575  (Δ = −0.0002, Tied)</text>
      <text x="200" y="104" font-size="12" fill="#4a5560" text-anchor="middle">NMP retains BA-head (Δ = −0.0137, Holm-robust)</text>
    </g>

    <!-- bottom cite -->
    <text x="0" y="365" font-size="11" fill="#8da1b8" font-style="italic">Source: Table 1 + SI JSON ledgers (515 / 515 claims MATCH)</text>
    <text x="0" y="383" font-size="11" fill="#8da1b8" font-style="italic">Case study: eval-set fit AUROC 0.862 → 0.442 held-out (withdrawn)</text>
  </g>

  <!-- footer -->
  <line x1="30" y1="500" x2="1298" y2="500" stroke="#dbe2eb" stroke-width="1"/>
  <text x="30" y="520" font-size="11" fill="#8da1b8">
    Wang &amp; Nand · MDPI Information · SI: Emerging Trends in ML &amp; NLP · 2026 · github.com/KevinSimple/deepneo-pub
  </text>
</svg>
